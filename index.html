<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Billedekomprimering · Best One</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23225581'/%3E%3Ctext x='32' y='45' font-family='Arial, sans-serif' font-size='38' font-weight='700' fill='white' text-anchor='middle'%3Eb%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- JSZip bruges først ved download, så den må ikke blokere for at siden vises -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* Best One designsprog, samme som Kvalitetstjek */
    :root{
      --navy:#225581;--navy-dark:#1a4266;--navy-soft:#eaf0f6;
      --ok:#188038;--ok-dark:#136b2e;--ok-bg:#eaf7ee;--ok-border:#bfe6c9;
      --warn:#b26a00;--warn-bg:#fdf3e0;--warn-border:#f3ddac;
      --error:#c5221f;--error-bg:#fdecea;--error-border:#f3c2bf;
      --bg:#f4f6f8;--card:#fff;--border:#e1e6eb;--text:#1c2b3a;--text-muted:#5b6b7a;
      --shadow:0 1px 2px rgba(20,40,60,.04);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    button{font-family:inherit;}
    [hidden]{display:none!important;}

    /* HEADER */
    header{padding:56px 24px 0;}
    header .inner{max-width:950px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
    .logo-mark{width:56px;height:56px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:28px;}
    header h1{font-size:38px;font-weight:800;}
    header p{font-size:15px;color:var(--text-muted);}
    #gbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:999;}
    #gfill{height:100%;width:0;background:var(--navy);transition:width .25s ease;}

    main{max-width:950px;margin:0 auto;padding:44px 24px 60px;display:flex;flex-direction:column;gap:12px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);}

    /* INDSTILLINGER */
    .settings{padding:20px;display:flex;flex-direction:column;gap:10px;}
    .toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px;gap:4px;}
    .toggle button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:999px;border:none;background:transparent;font-size:14px;font-weight:700;color:var(--text-muted);cursor:pointer;white-space:nowrap;transition:background .15s ease,color .15s ease;}
    .toggle button:hover{color:var(--text);}
    .toggle button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(20,40,60,.1);}
    .toggle .qs{font-size:12px;font-weight:700;opacity:.6;}
    .note{display:flex;align-items:flex-start;gap:8px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;}
    .note svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;color:var(--warn);}

    /* UPLOAD */
    .drop{display:block;border:2px dashed var(--border);border-radius:12px;background:var(--card);padding:48px 24px;text-align:center;cursor:pointer;position:relative;transition:border-color .2s,background .2s;}
    .drop:hover{border-color:var(--navy);background:var(--navy-soft);}
    .drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
    .drop-icon{width:44px;height:44px;background:var(--navy-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--navy);transition:background .2s;}
    .drop:hover .drop-icon{background:#dbe6f1;}
    .drop-icon svg{width:22px;height:22px;}
    .drop-title{font-size:15px;font-weight:700;}
    .drop-paste{font-size:13px;color:var(--text-muted);margin-top:6px;}
    kbd{font-family:inherit;font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text);}
    #drag-overlay{position:fixed;inset:0;background:rgba(34,85,129,.08);border:3px dashed var(--navy);z-index:500;pointer-events:none;display:flex;align-items:center;justify-content:center;}
    #drag-overlay div{font-size:20px;font-weight:800;color:var(--navy);background:var(--card);padding:18px 36px;border-radius:12px;box-shadow:0 8px 24px rgba(20,40,60,.12);}

    /* FILLISTE */
    #list-wrap{overflow:hidden;}
    #list{max-height:360px;overflow-y:auto;}
    .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px;position:relative;}
    .row:last-child{border-bottom:none;}
    .row:hover{background:#fafbfc;}
    .r-name{flex:1;display:flex;align-items:center;gap:6px;min-width:0;}
    .r-file{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600;}
    .r-file:hover{color:var(--navy);text-decoration:underline;}
    .r-del{flex-shrink:0;background:none;border:none;cursor:pointer;color:var(--text-muted);padding:2px 3px;border-radius:4px;display:flex;opacity:0;transition:opacity .15s,color .15s;}
    .row:hover .r-del{opacity:1;}
    .r-del:hover{color:var(--error);}
    .r-del svg{width:14px;height:14px;}
    .r-dim,.r-orig,.r-out,.r-arrow{flex-shrink:0;text-align:right;}
    .r-dim{min-width:80px;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
    .r-dim.big{color:var(--warn);font-weight:700;cursor:help;}
    .r-orig{min-width:56px;color:var(--text-muted);}
    .r-arrow{color:#b7c1cb;}
    .r-out{min-width:62px;font-weight:700;}
    .r-out.done{color:var(--ok);}
    .r-out.over{color:var(--warn);cursor:help;}
    .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
    .s-wait{background:var(--bg);color:var(--text-muted);}
    .s-work{background:var(--warn-bg);color:var(--warn);animation:pulse 1.2s ease-in-out infinite;}
    .s-done{background:var(--ok-bg);color:var(--ok);}
    .s-err{background:var(--error-bg);color:var(--error);}
    @keyframes pulse{50%{opacity:.5}}
    .r-bar{position:absolute;bottom:0;left:16px;right:16px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
    .r-bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .25s ease;}
    .list-foot{padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);font-size:13px;color:var(--text-muted);}
    .list-foot strong{color:var(--text);font-weight:700;}
    .list-foot .green{color:var(--ok);}

    /* KNAPPER */
    #actions{display:flex;flex-direction:column;gap:12px;}
    .btn-big{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;}
    .btn-big svg{width:18px;height:18px;flex-shrink:0;}
    #btn-run{background:var(--navy);}
    #btn-run:hover{background:var(--navy-dark);}
    #btn-run.busy{background:var(--navy-dark);cursor:progress;}
    #btn-run.busy svg{animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    #btn-dl{background:var(--ok);font-size:16px;font-weight:700;padding:15px 22px;}
    #btn-dl:hover{background:var(--ok-dark);}
    #btn-dl:disabled{cursor:progress;opacity:.85;}
    #btn-dl svg{width:20px;height:20px;}
    .actions-sm{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;}
    .link-btn{background:none;border:none;padding:0;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .link-btn:hover{text-decoration:underline;}
    .link-btn svg{width:13px;height:13px;}
    .link-btn.danger{color:var(--error);}
    .link-btn.retry{color:var(--warn);}
    /* Lås indstillinger og liste mens der komprimeres */
    body.running .toggle button,body.running .r-del,body.running .actions-sm button{pointer-events:none;opacity:.45;}

    /* RESULTAT */
    #summary{border-radius:12px;padding:26px 22px;text-align:center;background:var(--ok-bg);border:1px solid var(--ok-border);}
    #summary.partial{background:var(--warn-bg);border-color:var(--warn-border);}
    #summary-title{font-weight:800;font-size:26px;letter-spacing:.02em;color:var(--ok);}
    #summary.partial #summary-title{color:var(--warn);}
    #summary-text{font-weight:500;font-size:14px;margin-top:6px;}

    /* FORHÅNDSVISNING */
    #modal{position:fixed;inset:0;background:rgba(20,40,60,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;}
    .mbox{background:var(--card);border-radius:12px;overflow:hidden;max-width:1100px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,40,60,.3);}
    .mhead{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .mtitle{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .mclose{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px;display:flex;}
    .mclose:hover{background:var(--bg);color:var(--text);}
    .mclose svg{width:20px;height:20px;}
    .mpanes{display:grid;grid-template-columns:1fr 1fr;flex:1;overflow:hidden;}
    .mpane{display:flex;flex-direction:column;overflow:hidden;}
    .mpane+.mpane{border-left:1px solid var(--border);}
    .mlabel{padding:10px 16px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
    .mlabel span{font-weight:600;text-transform:none;letter-spacing:0;}
    .mimg{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--bg);min-height:300px;}
    .mimg img{max-width:100%;max-height:60vh;object-fit:contain;border-radius:6px;}
    .mwait{font-size:13px;color:var(--text-muted);text-align:center;line-height:1.6;}

    /* FEJL OG ADVARSLER */
    #toast{position:fixed;bottom:24px;right:24px;width:340px;max-width:calc(100vw - 48px);background:var(--card);border:1px solid var(--error-border);border-left:4px solid var(--error);border-radius:12px;padding:14px 16px;font-size:13px;box-shadow:0 8px 24px rgba(20,40,60,.15);z-index:2000;display:flex;flex-direction:column;gap:8px;animation:toastIn .2s ease;}
    @keyframes toastIn{from{opacity:0;transform:translateY(8px);}}
    .t-title{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--error);}
    .t-title svg{width:16px;height:16px;flex-shrink:0;}
    .t-msg{line-height:1.5;}
    .t-code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:12px;background:var(--bg);border:1px solid var(--border);padding:6px 10px;border-radius:8px;color:var(--text-muted);}
    .t-actions{display:flex;align-items:center;gap:16px;}
    .t-copy,.t-close{background:none;border:none;padding:0;font-size:13px;font-weight:600;cursor:pointer;}
    .t-copy{color:var(--navy);}
    .t-close{margin-left:auto;color:var(--text-muted);}
    .t-copy:hover,.t-close:hover{text-decoration:underline;}
    #toast.warn{border-color:var(--warn-border);border-left-color:var(--warn);}
    #toast.warn .t-title{color:var(--warn);}
    #toast.warn .t-code,#toast.warn .t-copy{display:none;}

    @media (max-width:600px){
      header h1{font-size:30px;}
      .toggle button{padding:10px 8px;font-size:13px;flex-direction:column;gap:0;}
      .r-dim,.r-arrow{display:none;}
      .mpanes{grid-template-columns:1fr;}
      .mpane+.mpane{border-left:none;border-top:1px solid var(--border);}
    }
  </style>
</head>
<body>

<div id="drag-overlay" hidden><div>Slip billederne her</div></div>
<div id="gbar" hidden><div id="gfill"></div></div>

<header>
  <div class="inner">
    <div class="logo-mark" id="logo">b</div>
    <div>
      <h1>Billedekomprimering</h1>
      <p>Komprimér billeder, så de er klar til hjemmesiden</p>
    </div>
  </div>
</header>

<main>
  <div class="card settings">
    <div class="toggle" id="seg-quality">
      <button data-q="70">God <span class="qs">250 KB</span></button>
      <button data-q="82">Høj <span class="qs">350 KB</span></button>
      <button data-q="92" class="on">Maksimal <span class="qs">500 KB</span></button>
    </div>
    <div class="toggle" id="seg-mode">
      <button data-mode="fit" class="on">Bevar proportioner</button>
      <button data-mode="crop">Crop til 1920×1280</button>
    </div>
    <div class="note" id="size-note" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="size-note-text"></span>
    </div>
  </div>

  <label class="drop" id="drop">
    <input type="file" id="file-input" multiple
      accept="image/jpeg,image/png,image/webp,image/gif,image/bmp,image/avif,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif,.heic,.heif"/>
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <div class="drop-title">Træk billeder hertil eller klik for at vælge</div>
    <div class="drop-paste">Du kan også indsætte et kopieret billede med <kbd id="paste-key">Ctrl+V</kbd></div>
  </label>

  <div class="card" id="list-wrap" hidden>
    <div id="list"></div>
    <div class="list-foot" id="list-foot"></div>
  </div>

  <div id="actions" hidden>
    <button class="btn-big" id="btn-run">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      <span id="run-label">Optimer og download filer</span>
    </button>
    <button class="btn-big" id="btn-dl" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="dl-label">Download igen</span>
    </button>
    <div class="actions-sm">
      <button class="link-btn retry" id="btn-retry" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span id="retry-label">Prøv fejlede igen</span>
      </button>
      <button class="link-btn" id="btn-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Tilføj flere billeder
      </button>
      <button class="link-btn danger" id="btn-clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Ryd alt
      </button>
    </div>
  </div>

  <div id="summary" hidden>
    <div id="summary-title"></div>
    <div id="summary-text"></div>
  </div>
</main>

<div id="modal" hidden>
  <div class="mbox">
    <div class="mhead">
      <span class="mtitle" id="m-title"></span>
      <button class="mclose" id="m-close" aria-label="Luk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="mpanes">
      <div class="mpane">
        <div class="mlabel">Original <span id="m-orig-size"></span></div>
        <div class="mimg"><img id="m-orig" alt="Original"/></div>
      </div>
      <div class="mpane">
        <div class="mlabel">Komprimeret <span id="m-out-size"></span></div>
        <div class="mimg">
          <div class="mwait" id="m-wait">Billedet er endnu ikke komprimeret.<br/>Kør komprimering først.</div>
          <img id="m-out" alt="Komprimeret" hidden/>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" hidden>
  <div class="t-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="t-title"></span>
  </div>
  <div class="t-msg" id="t-msg"></div>
  <div class="t-code" id="t-code"></div>
  <div class="t-actions">
    <button class="t-copy" id="t-copy">Kopiér fejldetaljer</button>
    <button class="t-close" id="t-close">Luk</button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   Billedekomprimering · Best One A/S
   Hæv APP_VERSION ved hver ændring, så man kan se hvilken version en
   bruger kører (vises i fejlkoder, fejldetaljer og ved hover på b-mærket).

   Fejlkoder: 001 HEIC-konvertering · 002 billede kunne ikke indlæses ·
   003 canvas/hukommelse · 004 ZIP · 005 ukendt · 006 HEIC-bibliotek
   kunne ikke hentes
   ===================================================================== */
const APP_VERSION='2.2.1';

const LIMITS={70:{kb:250,q:0.82,label:'God'},82:{kb:350,q:0.90,label:'Høj'},92:{kb:500,q:0.96,label:'Maksimal'}};
const CROP_W=1920,CROP_H=1280,MIN_Q=0.50;
const PX_PER_KB=25000; // over ca. 12,5 MP (500 KB) kan "Bevar proportioner" ikke ramme grænsen
const OK_TYPES=['image/jpeg','image/png','image/webp','image/gif','image/bmp','image/avif','image/heic','image/heif'];
const OK_EXT=/\.(jpe?g|png|webp|gif|bmp|avif|heic|heif)$/i;
const HEIC_URL='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
const LS_KEY='bo-billedkomprimering';
const RUN_TEXT='Optimer og download filer';
const STATUS={wait:['s-wait','Klar'],work:['s-work','Behandler…'],done:['s-done','Færdig'],err:['s-err','Fejl']};

const settings={q:92,crop:false};
const limit=()=>LIMITS[settings.q];
let files=[],running=false;

const $=id=>document.getElementById(id);
const el={
  drop:$('drop'),input:$('file-input'),overlay:$('drag-overlay'),
  listWrap:$('list-wrap'),list:$('list'),foot:$('list-foot'),
  note:$('size-note'),noteText:$('size-note-text'),
  actions:$('actions'),run:$('btn-run'),runLabel:$('run-label'),
  dl:$('btn-dl'),dlLabel:$('dl-label'),retry:$('btn-retry'),retryLabel:$('retry-label'),
  add:$('btn-add'),clear:$('btn-clear'),summary:$('summary'),summaryTitle:$('summary-title'),summaryText:$('summary-text'),
  gbar:$('gbar'),gfill:$('gfill'),
  modal:$('modal'),mTitle:$('m-title'),mOrig:$('m-orig'),mOut:$('m-out'),mWait:$('m-wait'),
  mOrigSize:$('m-orig-size'),mOutSize:$('m-out-size'),
  toast:$('toast'),tTitle:$('t-title'),tMsg:$('t-msg'),tCode:$('t-code'),tCopy:$('t-copy')
};

/* ---------- Hjælpere ---------- */
const isHeic=f=>/\.(heic|heif)$/i.test(f.name)||f.type==='image/heic'||f.type==='image/heif';
const isJpeg=f=>f.type==='image/jpeg'||/\.jpe?g$/i.test(f.name);
const isValid=f=>OK_TYPES.includes(f.type)||OK_EXT.test(f.name);
const isBig=f=>!settings.crop&&f.w*f.h>limit().kb*PX_PER_KB;
const plural=(n,one,many)=>n===1?one:many;
const pad=v=>String(v).padStart(2,'0');
const today=(d=new Date())=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtBytes(b){
  if(b>=1048576)return(b/1048576).toFixed(1)+' MB';
  if(b>=1024)return Math.round(b/1024)+' KB';
  return b+' B';
}
function fmtTimeLeft(sec){
  return sec<60?`ca. ${Math.max(5,Math.round(sec/5)*5)} sek. tilbage`:`ca. ${Math.round(sec/60)} min. tilbage`;
}
function progress(pct){
  el.gbar.hidden=pct===null;
  el.gfill.style.width=(pct||0)+'%';
}

/* Filnavne er altid webvenlige: små bogstaver, æøå til ae/oe/aa,
   accenter fjernes, alt andet end bogstaver og tal bliver til bindestreg */
function webName(name){
  return name.replace(/\.[^.]+$/,'').toLowerCase()
    .replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'billede';
}
// Sikrer unikke navne i den endelige download
function outNames(list){
  const used=new Set();
  return list.map(f=>{
    let name=f.base,n=2;
    while(used.has(name))name=`${f.base}-${n++}`;
    used.add(name);
    return name+'.jpg';
  });
}

/* ---------- Version ---------- */
$('logo').title='Billedekomprimering v'+APP_VERSION;

/* ---------- Fejl og advarsler ---------- */
let toastTimer=null,lastDetails='';
function browserInfo(){
  const ua=navigator.userAgent;
  const name=[['Edge',/Edg\/(\d+)/],['Chrome',/Chrome\/(\d+)/],['Firefox',/Firefox\/(\d+)/],['Safari',/Version\/(\d+).*Safari/]]
    .map(([n,re])=>{const r=ua.match(re);return r&&`${n} ${r[1]}`;}).find(Boolean)||'Ukendt browser';
  return`${name} på ${navigator.userAgentData?.platform||navigator.platform||'ukendt system'}`;
}
function buildDetails(code,failed=[]){
  const lines=[
    `Billedekomprimering v${APP_VERSION}`,
    `Tidspunkt: ${new Date().toLocaleString('da-DK')}`,
    `Fejlkode: ${code}`,
    `Browser: ${browserInfo()}`,
    `Indstillinger: ${limit().label} (${limit().kb} KB), ${settings.crop?'Crop':'Bevar proportioner'}`,
    `Billeder i alt: ${files.length}`
  ];
  if(failed.length){
    lines.push('','Fejlede billeder:');
    failed.slice(0,20).forEach(f=>lines.push(
      `• ${f.file.name} | fejl ${f.errCode} | ${f.file.type||'ukendt type'} | ${fmtBytes(f.file.size)} | ${f.w?`${f.w}×${f.h} px`:'ukendte dimensioner'}`));
    if(failed.length>20)lines.push(`… og ${failed.length-20} flere`);
  }
  return lines.join('\n');
}
function showToast(type,title,msg,code,details){
  clearTimeout(toastTimer);
  el.toast.classList.toggle('warn',type==='warn');
  el.tTitle.textContent=title;
  el.tMsg.textContent=msg;
  if(type==='error'){
    el.tCode.textContent=`Fejlkode: ${code} · v${APP_VERSION}`;
    el.tCopy.textContent='Kopiér fejldetaljer';
    lastDetails=details||buildDetails(code);
  }else{
    toastTimer=setTimeout(()=>el.toast.hidden=true,10000); // fejl bliver stående, advarsler forsvinder selv
  }
  el.toast.hidden=false;
}
const showError=(code,msg,details)=>showToast('error','Noget gik galt',msg,code,details);
const showWarning=(title,msg)=>showToast('warn',title,msg);
$('t-close').addEventListener('click',()=>el.toast.hidden=true);
el.tCopy.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(lastDetails);}
  catch{
    const ta=Object.assign(document.createElement('textarea'),{value:lastDetails});
    document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();
  }
  el.tCopy.textContent='Kopieret ✓';
});

/* ---------- HEIC: biblioteket hentes først når der er brug for det ---------- */
let heicLib=null;
function loadHeicLib(){
  if(window.heic2any)return Promise.resolve();
  heicLib??=new Promise((res,rej)=>{
    const sc=Object.assign(document.createElement('script'),{src:HEIC_URL,async:true});
    sc.onload=()=>window.heic2any?res():rej(new Error('heic2any mangler'));
    sc.onerror=()=>{sc.remove();rej(new Error('HEIC-biblioteket kunne ikke hentes'));};
    document.head.append(sc);
  }).catch(err=>{heicLib=null;throw Object.assign(err,{code:'006'});}); // næste forsøg prøver igen
  return heicLib;
}

/* ---------- Upload: klik, træk og slip, indsæt ---------- */
el.input.addEventListener('change',()=>{addFiles([...el.input.files]);el.input.value='';});
el.add.addEventListener('click',()=>el.input.click());

let dragTimer=null;
document.addEventListener('dragenter',e=>{
  if(!e.dataTransfer.types.includes('Files'))return;
  clearTimeout(dragTimer);el.overlay.hidden=false;
});
document.addEventListener('dragleave',()=>{
  clearTimeout(dragTimer);
  dragTimer=setTimeout(()=>el.overlay.hidden=true,80);
});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();el.overlay.hidden=true;
  if(e.dataTransfer.files.length)addFiles([...e.dataTransfer.files]);
});

if(/Mac|iPhone|iPad/.test(navigator.userAgentData?.platform||navigator.platform))$('paste-key').textContent='⌘+V';
document.addEventListener('paste',e=>{
  const items=[...(e.clipboardData?.items||[])].filter(it=>it.kind==='file');
  if(!items.length)return; // almindelig tekst ignoreres
  e.preventDefault();
  const d=new Date(),ts=`${today(d)}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  const pasted=items.map((it,k)=>{
    const blob=it.getAsFile();
    if(!blob||!it.type.startsWith('image/'))return blob; // fx en PDF beholder sit navn, så advarslen giver mening
    const ext=it.type.split('/')[1].replace('jpeg','jpg');
    // Udklipsholderen kalder altid billedet "image.png", så det får et sigende navn
    return new File([blob],`indsat-billede-${ts}${items.length>1?'-'+(k+1):''}.${ext}`,{type:it.type});
  }).filter(Boolean);
  addFiles(pasted);
});

function addFiles(incoming){
  if(running||!incoming.length)return;
  const rejected=incoming.filter(f=>!isValid(f));
  if(rejected.length){
    const names=rejected.slice(0,3).map(f=>f.name).join(', ')+(rejected.length>3?` og ${rejected.length-3} andre`:'');
    showWarning(plural(rejected.length,'Filtype understøttes ikke','Filtyper understøttes ikke'),
      `${names} er sprunget over. Brug JPG, PNG, HEIC eller WEBP.`);
  }
  const fresh=incoming.filter(f=>isValid(f)&&!files.some(x=>x.file.name===f.name&&x.file.size===f.size));
  if(!fresh.length)return;
  for(const file of fresh){
    const entry={file,base:webName(file.name),status:'wait',w:0,h:0,blob:null,kb:null};
    files.push(entry);
    readDims(entry);
  }
  if(fresh.some(isHeic))loadHeicLib().catch(()=>{}); // hentes i baggrunden, klar når man trykker
  el.summary.hidden=true;
  showRunButton();
  renderList(true);
}

// Læser kun dimensionerne, uden at afkode hele billedet
function readDims(entry){
  const img=new Image(),url=URL.createObjectURL(entry.file);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    entry.w=img.naturalWidth;entry.h=img.naturalHeight;
    paintRow(files.indexOf(entry));
    updateSizeNote();
  };
  img.onerror=()=>URL.revokeObjectURL(url); // fx HEIC i Chrome: kendes først efter konvertering
  img.src=url;
}

/* ---------- Indstillinger ---------- */
function bindSegment(id,apply){
  const seg=$(id);
  seg.addEventListener('click',e=>{
    const btn=e.target.closest('button');
    if(!btn||btn.classList.contains('on'))return;
    seg.querySelector('.on').classList.remove('on');
    btn.classList.add('on');
    apply(btn);
    saveSettings();updateSizeNote();resetResults();
  });
}
bindSegment('seg-quality',b=>settings.q=+b.dataset.q);
bindSegment('seg-mode',b=>settings.crop=b.dataset.mode==='crop');

// Ny kvalitet eller størrelse betyder at alt skal komprimeres igen
function resetResults(){
  for(const f of files)if(f.status==='done')Object.assign(f,{status:'wait',blob:null,kb:null,keptOriginal:false});
  el.retry.hidden=true;el.summary.hidden=true;
  if(files.length){showRunButton();renderList();}
}

function saveSettings(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(settings));}catch{}
}
function restoreSettings(){
  let st;
  try{st=JSON.parse(localStorage.getItem(LS_KEY));}catch{}
  if(!st)return;
  document.querySelector(`#seg-quality [data-q="${st.q}"]`)?.click();
  const crop=st.crop??st.mode==='crop'; // understøtter også indstillinger gemt af v2.0
  document.querySelector(`#seg-mode [data-mode="${crop?'crop':'fit'}"]`)?.click();
}

function updateSizeNote(){
  const big=files.filter(isBig);
  el.note.hidden=!big.length;
  if(!big.length)return;
  const top=big.reduce((a,b)=>a.w*a.h>b.w*b.h?a:b),n=big.length;
  el.noteText.textContent=
    `${n} ${plural(n,'billede er meget stort','af dine billeder er meget store')} (op til ${top.w}×${top.h} px). `+
    `Ved "Bevar proportioner" beholder de deres originale størrelse og kan derfor ende over ${limit().kb} KB. `+
    `Vælg Crop, hvis billederne skal under grænsen.`;
}

/* ---------- Liste ---------- */
function estimateKB(f){
  if(f.status==='done')return f.kb;
  const est=Math.round(limit().kb*0.8);
  // Ved "Bevar proportioner" bliver en JPG aldrig større end originalen
  return !settings.crop&&isJpeg(f.file)?Math.min(est,Math.max(1,Math.round(f.file.size/1024))):est;
}

// rebuild=true når antallet af billeder ændres, ellers opdateres rækkerne bare
function renderList(rebuild=false){
  el.listWrap.hidden=!files.length;
  if(rebuild){
    el.list.innerHTML=files.map((f,i)=>`
      <div class="row" data-i="${i}">
        <span class="r-name">
          <span class="r-file" title="${esc(f.file.name)}">${esc(f.file.name)}</span>
          <button class="r-del" title="Fjern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </span>
        <span class="r-dim"></span><span class="r-orig">${fmtBytes(f.file.size)}</span>
        <span class="r-arrow">→</span><span class="r-out"></span><span class="badge"></span>
        <div class="r-bar" hidden><i></i></div>
      </div>`).join('');
  }
  let totOut=0,totOrig=0;
  files.forEach((f,i)=>{totOut+=estimateKB(f);totOrig+=f.file.size;paintRow(i);});
  el.foot.innerHTML=`<strong>${files.length} ${plural(files.length,'billede','billeder')}</strong> &nbsp;·&nbsp; ${fmtBytes(totOrig)} → <strong class="green">${fmtBytes(totOut*1024)}</strong>`;
}

function paintRow(i){
  const f=files[i],row=el.list.children[i];
  if(!f||!row)return;
  const [dim,,,out,badge]=row.querySelectorAll('.r-dim,.r-orig,.r-arrow,.r-out,.badge');
  dim.textContent=f.w?`${f.w}×${f.h}`:'';
  dim.classList.toggle('big',isBig(f));
  dim.title=isBig(f)?'Meget stort billede. Kan ende over grænsen ved "Bevar proportioner".':'';
  const done=f.status==='done',over=done&&f.kb>f.limitKb;
  out.textContent=(done?'':'~')+estimateKB(f)+' KB';
  out.className='r-out'+(over?' over':done?' done':'');
  out.title=over?`Over grænsen på ${f.limitKb} KB. Vælg Crop for at komme under.`:
            f.keptOriginal?'Originalen var allerede mindst, så den er brugt uændret.':'';
  [badge.className,badge.textContent]=['badge '+STATUS[f.status][0],STATUS[f.status][1]];
}

function setRowProgress(i,pct){
  const bar=el.list.children[i]?.querySelector('.r-bar');
  if(!bar)return;
  bar.hidden=!(pct>0&&pct<100);
  bar.firstChild.style.width=pct+'%';
}

// Én lytter til hele listen i stedet for to pr. række
el.list.addEventListener('click',e=>{
  const row=e.target.closest('.row');
  if(!row)return;
  const i=+row.dataset.i;
  if(e.target.closest('.r-del'))removeFile(i);
  else if(e.target.closest('.r-file'))openModal(i);
});

function removeFile(i){
  if(running)return;
  files.splice(i,1);
  if(!files.some(f=>f.status==='err'))el.retry.hidden=true;
  updateSizeNote();
  if(!files.length)return resetAll();
  renderList(true);
}

function resetAll(){
  files=[];
  el.list.innerHTML='';el.listWrap.hidden=true;
  el.actions.hidden=true;el.summary.hidden=true;el.retry.hidden=true;
  el.drop.hidden=false;
  updateSizeNote();
}
el.clear.addEventListener('click',()=>{if(!running)resetAll();});

function showRunButton(){
  el.drop.hidden=true;el.actions.hidden=false;
  el.run.hidden=false;el.dl.hidden=true;
}

/* ---------- Forhåndsvisning ---------- */
const modalUrls=[];
function openModal(i){
  closeModal();
  const f=files[i];
  const url=b=>{const u=URL.createObjectURL(b);modalUrls.push(u);return u;};
  el.mTitle.textContent=f.base+'.jpg';
  el.mOrigSize.textContent=fmtBytes(f.file.size);
  el.mOrig.src=url(f.file);
  el.mOut.hidden=!f.blob;el.mWait.hidden=!!f.blob;
  el.mOutSize.textContent=f.blob?f.kb+' KB':'';
  if(f.blob)el.mOut.src=url(f.blob);
  el.modal.hidden=false;
}
function closeModal(){
  el.modal.hidden=true;
  el.mOrig.removeAttribute('src');el.mOut.removeAttribute('src');
  modalUrls.splice(0).forEach(u=>URL.revokeObjectURL(u));
}
$('m-close').addEventListener('click',closeModal);
el.modal.addEventListener('click',e=>{if(e.target===el.modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!el.modal.hidden)closeModal();});

/* ---------- Komprimering ---------- */
window.addEventListener('beforeunload',e=>{if(running){e.preventDefault();e.returnValue='';}});
el.run.addEventListener('click',runCompression);
el.retry.addEventListener('click',runCompression);

async function runCompression(){
  const queue=files.map((_,i)=>i).filter(i=>files[i].status!=='done');
  if(running||!queue.length)return;

  running=true;document.body.classList.add('running');
  showRunButton();
  el.run.disabled=true;el.run.classList.add('busy');
  el.retry.hidden=true;el.summary.hidden=true;
  const {kb:limitKb,q:startQ}=limit();
  for(const i of queue){
    Object.assign(files[i],{status:'wait',errCode:null,keptOriginal:false,limitKb});
    paintRow(i);
  }

  const total=queue.length,t0=performance.now();
  let done=0,next=0;
  const updateLabel=()=>{
    el.runLabel.textContent=`Komprimerer ${done} af ${total}`+
      (done>=2&&done<total?` · ${fmtTimeLeft((performance.now()-t0)/done/1000*(total-done))}`:'');
  };
  updateLabel();progress(2);

  // 3 billeder ad gangen, eller 2 hvis der er meget store billeder (hukommelse)
  const maxPx=Math.max(...queue.map(i=>files[i].w*files[i].h));
  const workers=Math.min(maxPx>25e6?2:3,total);
  async function worker(){
    while(next<queue.length){
      const i=queue[next++],f=files[i];
      f.status='work';paintRow(i);setRowProgress(i,5);
      try{
        f.blob=await processImage(f,startQ,limitKb,p=>setRowProgress(i,p));
        f.kb=Math.round(f.blob.size/1024);f.status='done';
      }catch(err){
        console.error(f.file.name,err);
        f.status='err';f.errCode=err.code||'005';
      }
      setRowProgress(i,0);paintRow(i);
      done++;updateLabel();progress(Math.round(done/total*95));
    }
  }
  await Promise.all(Array.from({length:workers},worker));

  running=false;document.body.classList.remove('running');
  el.run.disabled=false;el.run.classList.remove('busy');el.runLabel.textContent=RUN_TEXT;
  renderList();updateSizeNote();

  const failed=files.filter(f=>f.status==='err');
  if(failed.length){
    const codes=[...new Set(failed.map(f=>f.errCode))].join(', ');
    showError(codes,`${failed.length} ${plural(failed.length,'billede','billeder')} kunne ikke komprimeres. Klik på "Prøv fejlede igen" for at prøve igen.`,buildDetails(codes,failed));
    el.retryLabel.textContent=`Prøv fejlede igen (${failed.length})`;
    el.retry.hidden=false;
  }

  const finished=files.filter(f=>f.status==='done');
  if(!finished.length)return progress(null);
  progress(100);setTimeout(()=>progress(null),600);
  el.run.hidden=true;el.dl.hidden=false;

  const tOrig=finished.reduce((s,f)=>s+f.file.size,0),tOut=finished.reduce((s,f)=>s+f.blob.size,0);
  const overs=finished.filter(f=>f.kb>f.limitKb).length;
  el.summaryTitle.textContent=`${finished.length} ${plural(finished.length,'billede','billeder')} komprimeret`;
  el.summaryText.textContent=`Reduceret med ${Math.round((1-tOut/tOrig)*100)}% (${fmtBytes(tOrig)} → ${fmtBytes(tOut)})`+
    (overs?`. ${overs} ligger over ${limit().kb} KB og er markeret med orange.`:'');
  el.summary.classList.toggle('partial',overs>0);
  el.summary.hidden=false;
  downloadResults(); // starter automatisk
}

async function processImage(f,startQ,limitKb,onProgress){
  let src=f.file;
  if(isHeic(src)){
    onProgress(8);
    await loadHeicLib();
    try{
      const out=await window.heic2any({blob:src,toType:'image/png'});
      src=Array.isArray(out)?out[0]:out;
    }catch{throw Object.assign(new Error('HEIC-konvertering fejlede'),{code:'001'});}
  }
  const img=await loadImage(src);
  if(!f.w){f.w=img.naturalWidth;f.h=img.naturalHeight;}
  onProgress(30);

  const sw=img.naturalWidth,sh=img.naturalHeight,landscape=sw>=sh;
  const w=settings.crop?(landscape?CROP_W:CROP_H):sw;
  const h=settings.crop?(landscape?CROP_H:CROP_W):sh;
  const cv=document.createElement('canvas');
  let out;
  try{
    cv.width=w;cv.height=h;
    const ctx=cv.getContext('2d',{alpha:false});
    if(!ctx)throw Object.assign(new Error('Canvas kunne ikke oprettes'),{code:'003'});
    ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h); // gennemsigtige PNG'er bliver ikke sorte
    ctx.imageSmoothingQuality='high';
    if(settings.crop){
      // Skaler så billedet dækker hele formatet, og beskær centreret
      const s=Math.max(w/sw,h/sh),dw=Math.round(sw*s),dh=Math.round(sh*s);
      ctx.drawImage(img,Math.round((w-dw)/2),Math.round((h-dh)/2),dw,dh);
    }else{
      ctx.drawImage(img,0,0);
    }
    onProgress(60);
    out=await compressBest(cv,startQ,limitKb*1024,onProgress);
  }finally{
    cv.width=cv.height=0;img.src=''; // frigiv hukommelse med det samme
  }
  // Gør aldrig et billede større: er originalen en mindre JPG, bruges den uændret
  if(!settings.crop&&isJpeg(f.file)&&out.size>=f.file.size){out=f.file;f.keptOriginal=true;}
  return out;
}

function loadImage(blob){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(blob);
    img.onload=async()=>{
      URL.revokeObjectURL(url);
      try{await img.decode();}catch{} // afkoder uden at fryse siden
      resolve(img);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(Object.assign(new Error('Billede kunne ikke indlæses'),{code:'002'}));};
    img.src=url;
  });
}

const toJpeg=(cv,q)=>new Promise((res,rej)=>cv.toBlob(
  b=>b?res(b):rej(Object.assign(new Error('Canvas fejlede'),{code:'003'})),'image/jpeg',q));

// Binær søgning: højeste kvalitet der stadig er under grænsen (typisk 1 til 7 forsøg)
async function compressBest(cv,startQ,maxBytes,onProgress){
  const first=await toJpeg(cv,startQ);
  if(first.size<=maxBytes)return first;
  let lo=MIN_Q,hi=startQ,best=await toJpeg(cv,lo);
  if(best.size>maxBytes)return best; // kan ikke komme længere ned uden at blive grynet
  for(let k=0;k<5&&hi-lo>0.015;k++){
    const mid=(lo+hi)/2,b=await toJpeg(cv,mid);
    if(b.size<=maxBytes){best=b;lo=mid;}else hi=mid;
    onProgress(70+k*5);
  }
  return best;
}

/* ---------- Download ---------- */
function saveBlob(blob,name){
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:name});
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// 1 billede hentes direkte, flere pakkes i en ZIP
async function downloadResults(){
  const finished=files.filter(f=>f.status==='done');
  if(!finished.length)return;
  const names=outNames(finished);
  if(finished.length===1)return saveBlob(finished[0].blob,names[0]);
  el.dl.disabled=true;el.dlLabel.textContent='Pakker ZIP-fil…';
  try{
    const zip=new JSZip();
    finished.forEach((f,k)=>zip.file(names[k],f.blob));
    // STORE: JPG er allerede komprimeret, så ekstra ZIP-komprimering er spildtid
    saveBlob(await zip.generateAsync({type:'blob',compression:'STORE'}),`komprimerede-billeder-${today()}.zip`);
  }catch(err){
    console.error(err);
    showError('004','Noget gik galt. Prøv at genindlæse siden og kør igen.');
  }finally{
    el.dl.disabled=false;el.dlLabel.textContent='Download igen';
  }
}
el.dl.addEventListener('click',downloadResults);

restoreSettings();
</script>
